openapi: 3.0.3
info:
  title: Ansible Operator User-Metrics API
  description: >
    Local HTTP API served by internal/ansible/apiserver on the address/port
    configured via --metrics-bind-address (default port 5050). Ansible
    playbooks/roles POST to this endpoint (via the `k8s_status`-adjacent
    `operator_sdk.util.k8s_status` collection helpers or raw HTTP calls) to
    register and update custom Prometheus metrics from within a reconcile
    run. This API is not intended for external/remote clients; see
    THREAT_MODEL.md and docs/references/security.md for trust-boundary
    details.
  version: "1.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:5050
    description: Default local user-metrics listener
paths:
  /metrics:
    post:
      operationId: registerOrUpdateUserMetric
      summary: Register or update a custom Prometheus metric
      description: >
        Accepts a single metric definition and applies the requested
        operation (increment/set/observe/add) against the controller-runtime
        metrics registry. See internal/ansible/metrics/metrics.go for the
        Go type this schema mirrors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserMetric"
      responses:
        "200":
          description: Metric registered/updated successfully (empty body)
        "400":
          description: Invalid metric spec (missing name/description, or no operation set)
          content:
            text/plain:
              schema:
                type: string
        "405":
          description: Method not allowed (only POST is supported)
          content:
            text/plain:
              schema:
                type: string
    get:
      operationId: getMetrics
      summary: Not supported on this path
      description: This handler only accepts POST; GET returns 405.
      responses:
        "405":
          description: Method not allowed
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    UserMetric:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          description: Prometheus metric name
          example: my_custom_total
        description:
          type: string
          description: Prometheus HELP text
          example: Counts a custom event emitted from a role
        counter:
          $ref: "#/components/schemas/UserMetricCounter"
        gauge:
          $ref: "#/components/schemas/UserMetricGauge"
        histogram:
          $ref: "#/components/schemas/UserMetricHistogram"
        summary:
          $ref: "#/components/schemas/UserMetricSummary"
      description: >
        Exactly one of counter/gauge/histogram/summary should be set per
        request; the metric type is created on first use and reused on
        subsequent calls with the same name.
    UserMetricCounter:
      type: object
      properties:
        increment:
          type: boolean
          description: Increment the counter by 1
        add:
          type: number
          format: double
          description: Add an arbitrary positive value to the counter
    UserMetricGauge:
      type: object
      properties:
        set:
          type: number
          format: double
        increment:
          type: boolean
        decrement:
          type: boolean
        set_to_current_time:
          type: boolean
        add:
          type: number
          format: double
        subtract:
          type: number
          format: double
    UserMetricHistogram:
      type: object
      properties:
        observe:
          type: number
          format: double
    UserMetricSummary:
      type: object
      properties:
        observe:
          type: number
          format: double
