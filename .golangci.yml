linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - revive
    - gosec
    - depguard

linters-settings:
  depguard:
    rules:
      prevent-vendor-import:
        deny:
          - pkg: "github.com/operator-framework/ansible-operator-plugins/vendor"
            desc: "Do not import from vendor directory directly"
      prevent-test-in-prod:
        files:
          - "!*_test.go"
          - "!**/test/**"
        deny:
          - pkg: "github.com/stretchr/testify"
            desc: "testify is for tests only"
  revive:
    rules:
      - name: exported
        severity: warning
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-naming
      - name: increment-decrement
      - name: var-naming
      - name: range
      - name: receiver-naming

issues:
  exclude-dirs:
    - vendor
    - testdata
    - openshift/vendor
    - openshift/release
